<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>АПК Право — концепт первого экрана</title>
<style>
:root{--accent:#24324a;--ink:#161a17;--muted:#5b625c;--bg:#faf8f4;--line:#e7e2d8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{width:min(1120px,92vw);margin:0 auto}
header{padding:22px 0;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:19px}
.pill{background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700}
.hero{min-height:calc(100vh - 74px);display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:48px 0 64px}
.eyebrow{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 16px}
h1{font-size:clamp(38px,5.2vw,68px);line-height:1.02;letter-spacing:-.04em;font-weight:800;margin:0 0 22px}
.lead{font-size:clamp(16px,1.7vw,20px);color:var(--muted);max-width:46ch;margin:0 0 30px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.btn{padding:15px 28px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.facts{display:flex;gap:28px;list-style:none;padding:0;margin:0;color:var(--muted);font-size:14px}
.facts b{display:block;color:var(--ink);font-size:22px;letter-spacing:-.02em}
.art{aspect-ratio:1/1.05;border-radius:28px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 12%,#fff),#fff 62%)}
.art .ring{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;left:15%;top:15%;
  border:1.5px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.art .ring2{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;left:28%;top:28%;
  background:color-mix(in srgb,var(--accent) 9%,transparent)}
.art .word{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:clamp(26px,3vw,40px);font-weight:800;letter-spacing:-.04em;color:var(--accent)}
.note{padding:18px 0 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:860px){.hero{grid-template-columns:1fr;gap:26px;padding:24px 0 40px;min-height:0}
.art{order:-1;aspect-ratio:1.5/1}}
</style></head><body>
<header><div class="wrap head"><div class="brand">АПК Право</div><div class="pill">Казань</div></div></header>
<main class="wrap"><section class="hero">
<div>
  <p class="eyebrow">юридические услуги · Казань</p>
  <h1>Юридическая помощь без очередей</h1>
  <p class="lead">Консультации, документы и представительство. Концепт первого экрана для юридической фирмы.</p>
  <div class="cta"><span class="btn">Записаться</span><span class="btn ghost">Позвонить</span></div>
  <ul class="facts"></ul>
</div>
<div class="art"><div class="ring"></div><div class="ring2"></div><div class="word">АПК Право</div></div>
</section></main>
<div class="wrap note">Концепт первого экрана. Не клиентский заказ, реальные цены и услуги не показаны.</div>
</body></html>
